dist: xenial

language: python

python:
    - "2.7"

install:
    - sudo add-apt-repository ppa:deadsnakes/ppa -y
    - sudo apt-get update
    - sudo apt-get install python3.6 -y
    - sudo apt-get install python3-pip -y
    - make dep
    - make dev

script:
    # run static analysis and format check
    - python -V
    - python3 -V
    - python3.6 -V
    - pip -V
    - python3 -m pip -V
    - python3.6 -m pip -V
    - python3.6 -m pip install black
    - make test
